<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>現場スケジュール & 日報管理ポータル</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="現場日報">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="現場のスケジュール管理・見積書AI読取・Googleスプレッドシート連動日報ポータル">

  <!-- アイコン -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%230f172a'/><path d='M368 128H144c-17.7 0-32 14.3-32 32v256c0 17.7 14.3 32 32 32h224c17.7 0 32-14.3 32-32V160c0-17.7-14.3-32-32-32zm-16 240H160V192h192v176z' fill='%2310b981'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%230f172a'/><path d='M368 128H144c-17.7 0-32 14.3-32 32v256c0 17.7 14.3 32 32 32h224c17.7 0 32-14.3 32-32V160c0-17.7-14.3-32-32-32zm-16 240H160V192h192v176z' fill='%2310b981'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (完全クラウド同期用) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1.5rem);
    }
    /* iPhoneのステータスバー（時計など）に被らないようにする余白 */
    .pt-safe-header {
      padding-top: max(env(safe-area-inset-top), 0.75rem);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased select-none pb-28 pb-safe">

  <!-- ================= ヘッダー ================= -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs pt-safe-header">
    <div class="max-w-md mx-auto px-4 pb-2">
      <div class="flex items-center justify-between mt-2">
        <button onclick="toggleOptionsMenu()" class="p-2 -ml-2 text-slate-600 hover:text-slate-900 rounded-full active:bg-slate-100 transition-colors" title="連携・設定メニュー">
          <i class="fa-solid fa-gear text-lg text-emerald-600"></i>
        </button>
      </div>

      <!-- 年月セレクター & アクションボタン -->
      <div class="flex items-center justify-between mt-2">
        <div>
          <h2 id="currentYearMonthDisplay" class="text-2xl font-extrabold text-slate-900 tracking-tight leading-tight">2026年 8月</h2>
        </div>

        <div class="flex items-center space-x-1.5">
          <div class="flex items-center bg-slate-100 rounded-xl p-0.5 border border-slate-200">
            <button onclick="changeMonth(-1)" class="p-1.5 px-2 text-slate-600 hover:text-slate-900 active:bg-white rounded-lg transition-colors text-xs font-bold" title="前月">
              <i class="fa-solid fa-chevron-left text-[10px]"></i>
            </button>
            <button onclick="goToToday()" class="px-2 py-1 text-xs font-bold text-slate-700 hover:text-slate-900 active:bg-white rounded-lg transition-colors">今日</button>
            <button onclick="changeMonth(1)" class="p-1.5 px-2 text-slate-600 hover:text-slate-900 active:bg-white rounded-lg transition-colors text-xs font-bold" title="次月">
              <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
          </div>
          <button onclick="openAiScanModal()" class="flex items-center space-x-1 px-2.5 py-2 bg-emerald-600 active:bg-emerald-700 text-white rounded-2xl shadow-sm text-xs font-bold transition-transform active:scale-95" title="見積書を写真から自動読み取り">
            <i class="fa-solid fa-camera text-sm"></i>
            <span class="leading-none text-[11px] text-center">見積AI<br>読取</span>
          </button>
          <button onclick="openAddScheduleModal()" class="w-10 h-10 bg-slate-900 active:bg-slate-800 text-white rounded-2xl flex items-center justify-center shadow-md active:scale-95 transition-transform" title="現場スケジュールの手動登録">
            <i class="fa-solid fa-plus text-base"></i>
          </button>
        </div>
      </div>

      <!-- 班切り替えタブ -->
      <div class="flex items-center space-x-2 mt-3.5 overflow-x-auto custom-scrollbar pb-1">
        <button id="tab-all" onclick="setTeamFilter('all')" class="flex items-center px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-xs transition-all bg-slate-800 text-white">
          <span class="w-2 h-2 rounded-full bg-white mr-1.5"></span>全班表示
        </button>
        <button id="tab-yoshii" onclick="setTeamFilter('yoshii')" class="flex items-center px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-xs transition-all bg-white text-slate-700 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span>A【吉井】
        </button>
        <button id="tab-kumano" onclick="setTeamFilter('kumano')" class="flex items-center px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-xs transition-all bg-white text-slate-700 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>B【熊野】
        </button>
        <button id="tab-hisamoto" onclick="setTeamFilter('hisamoto')" class="flex items-center px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-xs transition-all bg-white text-slate-700 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-purple-600 mr-1.5"></span>C【久本】
        </button>
        <button id="tab-external" onclick="setTeamFilter('external')" class="flex items-center px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-xs transition-all bg-white text-slate-700 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-slate-600 mr-1.5"></span>外注
        </button>
      </div>

      <!-- カレンダー / 日報一覧 タブ -->
      <div class="grid grid-cols-2 mt-3 border-b border-slate-200 text-center">
        <button id="viewTab-calendar" onclick="switchView('calendar')" class="py-2.5 text-xs sm:text-sm font-bold border-b-2 border-emerald-600 text-emerald-600 flex items-center justify-center space-x-1.5 transition-all">
          <i class="fa-regular fa-calendar-check text-sm"></i>
          <span>カレンダー</span>
        </button>
        <button id="viewTab-report" onclick="switchView('report')" class="py-2.5 text-xs sm:text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 flex items-center justify-center space-x-1.5 transition-all">
          <i class="fa-regular fa-file-lines text-sm"></i>
          <span>日報報告</span>
          <span id="reportBadgeCount" class="text-[10px] bg-emerald-100 text-emerald-700 font-extrabold px-1.5 py-0.2 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full px-3 pt-2 flex-1">
    
    <!-- ================= 画面1: カレンダービュー ================= -->
    <div id="view-calendar-container" class="space-y-3">
      <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
        <div class="grid grid-cols-7 text-center py-2 border-b border-slate-100 text-xs font-bold">
          <span class="text-rose-500">日</span>
          <span class="text-slate-500">月</span>
          <span class="text-slate-500">火</span>
          <span class="text-slate-500">水</span>
          <span class="text-slate-500">木</span>
          <span class="text-slate-500">金</span>
          <span class="text-blue-500">土</span>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-100 text-xs">
          <!-- JS動的生成 -->
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <h3 id="selectedDateTitle" class="text-sm font-bold text-slate-900">現場スケジュール</h3>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="openAddScheduleModal()" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold flex items-center">
              <i class="fa-solid fa-plus mr-1"></i> 追加
            </button>
          </div>
        </div>
        <div id="dayScheduleList" class="space-y-2.5">
          <!-- JSでレンダリング -->
        </div>
      </div>
    </div>

    <!-- ================= 画面2: 日報報告フォーム ================= -->
    <div id="view-report-container" class="space-y-4 hidden">
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-xs border border-indigo-100 space-y-4">
        <div class="pb-3 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
              <i class="fa-solid fa-clipboard-list text-sm"></i>
            </div>
            <div>
              <h3 class="text-base font-extrabold text-slate-900 leading-tight">日報報告フォーム</h3>
              <div class="flex items-center space-x-1 mt-0.5">
                <p class="text-[10px] text-slate-400">Googleフォーム項目完全準拠</p>
                <span id="gasSyncBadge" class="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.2 rounded-full hidden">
                  <i class="fa-solid fa-file-excel mr-1"></i>スプシ自動連動中
                </span>
              </div>
            </div>
          </div>
          <div class="flex items-center space-x-1.5">
            <button onclick="autofillFromSelectedDaySchedule()" class="text-[11px] font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg hover:bg-indigo-100 transition-colors flex items-center">
              <i class="fa-solid fa-arrow-down-long mr-1"></i> 予定から引用
            </button>
            <button onclick="resetReportForm()" class="text-[11px] font-bold text-slate-400 hover:text-slate-600 px-2 py-1 rounded-lg">クリア</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">報告班 <span class="text-rose-500">*</span></label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 font-bold"><input type="radio" name="formReportTeam" value="yoshii" class="text-amber-500 mr-2" checked><span>A【吉井】</span></label>
            <label class="flex items-center p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 font-bold"><input type="radio" name="formReportTeam" value="kumano" class="text-emerald-500 mr-2"><span>B【熊野】</span></label>
            <label class="flex items-center p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 font-bold"><input type="radio" name="formReportTeam" value="hisamoto" class="text-purple-500 mr-2"><span>C【久本】</span></label>
            <label class="flex items-center p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 font-bold"><input type="radio" name="formReportTeam" value="external" class="text-slate-500 mr-2"><span>外注</span></label>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">作業日 <span class="text-rose-500">*</span></label>
          <input id="formWorkDate" type="date" required class="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">現場名【様は不要】 <span class="text-rose-500">*</span></label>
          <input id="formSiteName" type="text" placeholder="例: 高橋 健一 / 三好ビル" class="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center justify-between">
            <span>見積価格 (円)</span>
            <button type="button" onclick="autofillEstimatePriceFromSchedule()" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md"><i class="fa-solid fa-wand-magic-sparkles mr-1 text-amber-500"></i> 見積から引用</button>
          </label>
          <input id="formEstimatePrice" type="text" inputmode="numeric" pattern="\d*" placeholder="例: 150000" class="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 bg-slate-50">
        </div>

        <div class="bg-slate-50/80 p-3 rounded-2xl border border-slate-200 space-y-3">
          <span class="text-xs font-extrabold text-slate-800 flex items-center"><i class="fa-solid fa-users-gear text-indigo-500 mr-1.5"></i> 各自の人工入力</span>
          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs">
              <span class="text-[11px] font-bold text-slate-800 block mb-1">吉井</span>
              <div class="flex space-x-1.5 text-xs">
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-amber-100 has-[:checked]:bg-amber-500 has-[:checked]:text-white"><input type="radio" name="manpower_yoshii" value="1.0" class="sr-only"><span>1.0</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-amber-100 has-[:checked]:bg-amber-500 has-[:checked]:text-white"><input type="radio" name="manpower_yoshii" value="0.5" class="sr-only"><span>0.5</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-slate-200 has-[:checked]:bg-slate-700 has-[:checked]:text-white"><input type="radio" name="manpower_yoshii" value="0" checked class="sr-only"><span>なし</span></label>
              </div>
            </div>
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs">
              <span class="text-[11px] font-bold text-slate-800 block mb-1">久本</span>
              <div class="flex space-x-1.5 text-xs">
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-purple-100 has-[:checked]:bg-purple-600 has-[:checked]:text-white"><input type="radio" name="manpower_hisamoto" value="1.0" class="sr-only"><span>1.0</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-purple-100 has-[:checked]:bg-purple-600 has-[:checked]:text-white"><input type="radio" name="manpower_hisamoto" value="0.5" class="sr-only"><span>0.5</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-slate-200 has-[:checked]:bg-slate-700 has-[:checked]:text-white"><input type="radio" name="manpower_hisamoto" value="0" checked class="sr-only"><span>なし</span></label>
              </div>
            </div>
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs">
              <span class="text-[11px] font-bold text-slate-800 block mb-1">熊野</span>
              <div class="flex space-x-1.5 text-xs">
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-emerald-100 has-[:checked]:bg-emerald-500 has-[:checked]:text-white"><input type="radio" name="manpower_kumano" value="1.0" class="sr-only"><span>1.0</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-emerald-100 has-[:checked]:bg-emerald-500 has-[:checked]:text-white"><input type="radio" name="manpower_kumano" value="0.5" class="sr-only"><span>0.5</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-slate-200 has-[:checked]:bg-slate-700 has-[:checked]:text-white"><input type="radio" name="manpower_kumano" value="0" checked class="sr-only"><span>なし</span></label>
              </div>
            </div>
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs">
              <span class="text-[11px] font-bold text-slate-800 block mb-1">高川</span>
              <div class="flex space-x-1.5 text-xs">
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-indigo-100 has-[:checked]:bg-indigo-600 has-[:checked]:text-white"><input type="radio" name="manpower_takagawa" value="1.0" class="sr-only"><span>1.0</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-indigo-100 has-[:checked]:bg-indigo-600 has-[:checked]:text-white"><input type="radio" name="manpower_takagawa" value="0.5" class="sr-only"><span>0.5</span></label>
                <label class="flex-1 text-center py-1.5 rounded-lg cursor-pointer font-bold text-[11px] bg-slate-100 hover:bg-slate-200 has-[:checked]:bg-slate-700 has-[:checked]:text-white"><input type="radio" name="manpower_takagawa" value="0" checked class="sr-only"><span>なし</span></label>
              </div>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">残材量正味【kg】</label>
          <input id="formWasteAmount" type="text" placeholder="例: 350" class="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 bg-slate-50">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">外注費 (円)</label>
            <input id="formOutsourceFee" type="text" placeholder="例: 20000" class="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 bg-slate-50">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">外注費【予備】</label>
            <input id="formOutsourceFeeSub" type="text" placeholder="回答を入力" class="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 bg-slate-50">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">機材名① (複数選択可)</label>
          <div class="grid grid-cols-2 gap-2 text-[11px] bg-slate-50 p-2.5 rounded-xl border border-slate-200">
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="軽トラ1台【2000】" class="rounded text-indigo-600"><span>軽トラ1台【2000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="軽トラ2台【4000】" class="rounded text-indigo-600"><span>軽トラ2台【4000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="軽トラ3台【6000】" class="rounded text-indigo-600"><span>軽トラ3台【6000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="チェンソー1台【4000】" class="rounded text-indigo-600"><span>チェンソー1台【4000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="チェンソー2台【8000】" class="rounded text-indigo-600"><span>チェンソー2台【8000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="チェンソー3台【12000】" class="rounded text-indigo-600"><span>チェンソー3台【12000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="草刈機1台【2000】" class="rounded text-indigo-600"><span>草刈機1台【2000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="草刈機2台【4000】" class="rounded text-indigo-600"><span>草刈機2台【4000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="草刈機3台【6000】" class="rounded text-indigo-600"><span>草刈機3台【6000】</span></label>
            <label class="flex items-center space-x-1.5"><input type="checkbox" name="equipment1" value="除草剤散布1【2500】" class="rounded text-indigo-600"><span>除草剤散布1【2500】</span></label>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">機材名② (重機・ダンプ)</label>
          <div class="grid grid-cols-2 gap-2 text-[11px] bg-slate-50 p-2.5 rounded-xl border border-slate-200">

    function compressImageFile(file, maxWidth = 1000, quality = 0.75) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function fetchWithRetry(url, options = {}, retries = 5, backoff = 1000) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          if (response.status === 429 && retries > 0) {
            await new Promise(r => setTimeout(r, backoff));
            return fetchWithRetry(url, options, retries - 1, backoff * 2);
          }
          throw new Error(`HTTP Error: ${response.status}`);
        }
        return response;
      } catch (err) {
        if (retries > 0) {
          await new Promise(r => setTimeout(r, backoff));
          return fetchWithRetry(url, options, retries - 1, backoff * 2);
        }
        throw err;
      }
    }

    // --- クラウド同期 (Firestore) & ローカル保存ロジック ---
    function loadDataFromStorage() {
      // 1. ローカル読込
      try {
        const storedSchedules = localStorage.getItem('SCHEDULES_DATA');
        const storedReports = localStorage.getItem('REPORTS_DATA');
        if (storedSchedules) schedules = JSON.parse(storedSchedules);
        if (storedReports) dailyReports = JSON.parse(storedReports);
      } catch (e) { console.warn("ローカル読込エラー"); }

      // 2. クラウド同期
      if (db) {
        // スケジュール同期
        db.collection("schedules").onSnapshot(snapshot => {
          if (snapshot.empty && schedules.length > 0) {
             schedules.forEach(s => db.collection("schedules").doc(s.id).set(s));
          } else if (!snapshot.empty) {
             schedules = snapshot.docs.map(doc => doc.data());
             localStorage.setItem('SCHEDULES_DATA', JSON.stringify(schedules));
             renderAll();
             
             if (currentDetailScheduleId && !document.getElementById('scheduleDetailModal').classList.contains('hidden')) {
               const updated = schedules.find(s => s.id === currentDetailScheduleId);
               if (updated) {
                 renderBeforePhotoGrid(updated.beforePhotos || []);
                 if(document.activeElement !== document.getElementById('detailWarningsInput')) {
                    document.getElementById('detailWarningsInput').value = updated.warnings || '';
                 }
               } else {
                 closeScheduleDetailModal();
               }
             }
          }
        }, err => console.warn("同期エラー:", err));

        // 日報同期
        db.collection("reports").orderBy("createdAt", "desc").onSnapshot(snapshot => {
          if (snapshot.empty && dailyReports.length > 0) {
             dailyReports.forEach(r => db.collection("reports").doc(r.id).set({...r, createdAt: Date.now()}));
          } else if (!snapshot.empty) {
             dailyReports = snapshot.docs.map(doc => doc.data());
             localStorage.setItem('REPORTS_DATA', JSON.stringify(dailyReports));
             renderReportList();
          }
        }, err => console.warn("同期エラー:", err));
      }
    }

    async function handleBeforePhotoUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length || !currentDetailScheduleId) return;
      const item = schedules.find(s => s.id === currentDetailScheduleId);
      if (!item) return;
      if (!item.beforePhotos) item.beforePhotos = [];

      showToast('写真を軽量化して処理中...');
      for (const file of files) {
        const compressedBase64 = await compressImageFile(file, 1000, 0.75);
        item.beforePhotos.push(compressedBase64);
      }

      if (db) {
        await db.collection("schedules").doc(item.id).update({ beforePhotos: item.beforePhotos });
        showToast('施工前写真をクラウドに同期しました');
      } else {
        saveDataToStorage();
        renderBeforePhotoGrid(item.beforePhotos);
        showToast('写真を保存しました');
      }
    }

    function removeBeforePhoto(index) {
      const item = schedules.find(s => s.id === currentDetailScheduleId);
      if (!item || !item.beforePhotos) return;
      item.beforePhotos.splice(index, 1);
      
      if (db) db.collection("schedules").doc(item.id).update({ beforePhotos: item.beforePhotos });
      else { saveDataToStorage(); renderBeforePhotoGrid(item.beforePhotos); }
    }

    function deleteReportItem(reportId) {
      if (db) {
         db.collection("reports").doc(reportId).delete(); showToast('日報を削除し同期しました');
      } else {
         dailyReports = dailyReports.filter(r => r.id !== reportId);
         saveDataToStorage(); renderReportList(); showToast('日報を削除しました');
      }
      if (editingReportId === reportId) resetReportForm();
    }

    function openScheduleDetailModal(id) {
      currentDetailScheduleId = id;
      const item = schedules.find(s => s.id === id);
      if (!item) return;
      document.getElementById('detailTeamBadge').textContent = TEAM_INFO[item.teamId]?.name;
      document.getElementById('detailCustomerTitle').textContent = item.customer;
      document.getElementById('detailDateDisplay').textContent = item.date;
      document.getElementById('detailPriceDisplay').textContent = item.estimatePrice ? `¥${item.estimatePrice}` : '未設定';
      document.getElementById('detailLocationText').textContent = item.location || '未設定';
      document.getElementById('detailWarningsInput').value = item.warnings || '';
      renderBeforePhotoGrid(item.beforePhotos || []);
      document.getElementById('scheduleDetailModal').classList.remove('hidden');
      document.getElementById('scheduleDetailModal').classList.add('flex');
    }

    function closeScheduleDetailModal() {
      document.getElementById('scheduleDetailModal').classList.add('hidden');
      document.getElementById('scheduleDetailModal').classList.remove('flex');
      currentDetailScheduleId = null;
    }

    function renderBeforePhotoGrid(photos) {
      const grid = document.getElementById('beforePhotoGrid');
      if (!photos.length) { grid.innerHTML = `<div class="col-span-3 text-center py-4 text-[11px] text-slate-400">施工前写真はありません</div>`; return; }
      grid.innerHTML = photos.map((b64, i) => `<div class="relative rounded-xl overflow-hidden aspect-square cursor-pointer" onclick="openImageLightbox('${b64}')"><img src="${b64}" class="w-full h-full object-cover"><button onclick="event.stopPropagation(); removeBeforePhoto(${i})" class="absolute top-1 right-1 bg-slate-900/80 text-white rounded-full w-5 h-5 text-[10px]"><i class="fa-solid fa-xmark"></i></button></div>`).join('');
    }

    async function runGeminiExtraction(base64Data, mimeType) {
      const prompt = `あなたは建築・造園・電気工事の見積書解析プロです。添付画像から以下の情報を正確に読み取りJSONで出力してください。\n{"customer": "植村 祥子様","time": "08:30","estimatePrice": "44000","location": "香川県坂出市〇〇","detail": "センター斑入りトベラ植栽"}`;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Data } }] }], generationConfig: { responseMimeType: "application/json" } })
        });
        const data = await res.json();
        const p = JSON.parse(data.candidates[0].content.parts[0].text);
        document.getElementById('aiCustomer').value = p.customer || ''; document.getElementById('aiPrice').value = p.estimatePrice || ''; document.getElementById('aiLocation').value = p.location || ''; document.getElementById('aiDetail').value = p.detail || '';
        document.getElementById('aiLoadingOverlay').classList.add('hidden'); document.getElementById('extractionResults').classList.remove('hidden');
        showToast('✨ AI解析完了！');
      } catch (err) { showToast('読取失敗。手動入力してください。'); document.getElementById('aiLoadingOverlay').classList.add('hidden'); document.getElementById('extractionResults').classList.remove('hidden'); }
    }

    async function runAiPhotoRiskAnalysis() {
      const item = schedules.find(s => s.id === currentDetailScheduleId);
      if (!item || !item.beforePhotos?.length) { showToast('写真を1枚以上追加してください'); return; }
      const resBox = document.getElementById('aiDetailRiskResult'); resBox.classList.remove('hidden'); resBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> AI分析中...';
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: `現場写真です。事故防止の注意点・推奨工具を簡潔に。` }, { inlineData: { mimeType: "image/jpeg", data: item.beforePhotos[0].split(',')[1] } }] }] })
        });
        const d = await res.json(); resBox.innerHTML = `<strong class="text-purple-900"><i class="fa-solid fa-shield-halved"></i> AI診断:</strong><p>${d.candidates[0].content.parts[0].text}</p>`;
      } catch (e) { resBox.innerHTML = 'AI診断失敗'; }
    }

    async function generateAiRefinedReportMemo() {
      const m = document.getElementById('formMemo');
      if (!m.value.trim()) return showToast('下書きを入力してください');
      showToast('AI推敲中...');
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: `日報メモを推敲してください:\n${m.value}` }] }] }) });
        const d = await res.json(); m.value = d.candidates[0].content.parts[0].text; showToast('推敲完了');
      } catch(e) { showToast('推敲失敗'); }
    }

    const JAPANESE_HOLIDAYS = { '2026-01-01': '元日', '2026-01-12': '成人の日', '2026-02-11': '建国記念の日', '2026-02-23': '天皇誕生日', '2026-03-20': '春分の日', '2026-04-29': '昭和の日', '2026-05-03': '憲法記念日', '2026-05-04': 'みどりの日', '2026-05-05': 'こどもの日', '2026-05-06': '振替休日', '2026-07-20': '海の日', '2026-08-11': '山の日', '2026-09-21': '敬老の日', '2026-09-22': '国民の休日', '2026-09-23': '秋分の日', '2026-10-12': 'スポーツの日', '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日' };
    function getJapaneseHoliday(dateStr) { return JAPANESE_HOLIDAYS[dateStr] || null; }

    async function fetchKagawaWeather() {
      try {
        const res = await fetch('https://www.jma.go.jp/bosai/forecast/data/forecast/370000.json');
        const data = await res.json();
        const weekly = data[1].timeSeries[0];
        weekly.timeDefines.forEach((t, i) => { const d=new Date(t); weeklyWeather[`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`] = { emoji: getWeatherEmoji(weekly.areas[0].weatherCodes[i]), pop: weekly.areas[0].pops?.[i] || '' }; });
        renderCalendarGrid();
      } catch (e) {}
    }
    const getWeatherEmoji = (c) => c?.startsWith('1') ? '☀️' : c?.startsWith('2') ? '☁️' : c?.startsWith('3') ? '☔' : c?.startsWith('4') ? '⛄' : '☁️';

    function renderReportList() {
      const list = document.getElementById('reportCardList'); list.innerHTML = '';
      document.getElementById('reportBadgeCount').textContent = dailyReports.length;
      document.getElementById('reportTotalCount').textContent = `${dailyReports.length}件`;
      if (!dailyReports.length) { list.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">日報はありません</p>`; return; }
      dailyReports.forEach(r => {
        const c = document.createElement('div'); c.className = 'p-3 bg-slate-50 border rounded-xl shadow-sm text-xs space-y-1';
        c.innerHTML = `<div class="flex justify-between font-bold"><span>${r.siteName}</span><div class="space-x-1"><button onclick="editReportItem('${r.id}')" class="text-indigo-600 px-1">編集</button><button onclick="deleteReportItem('${r.id}')" class="text-rose-600 px-1">削除</button></div></div><div class="text-slate-500">${r.workDate} / ${r.workStatus}</div>`;
        list.appendChild(c);
      });
    }

    function editReportItem(id) {
       const r = dailyReports.find(x => x.id === id); if(!r) return;
       editingReportId = id;
       document.getElementById('formWorkDate').value = r.workDate;
       document.getElementById('formSiteName').value = r.siteName;
       switchView('report');
    }
    function resetReportForm() { editingReportId = null; document.getElementById('formSiteName').value = ''; document.getElementById('formMemo').value = ''; }
    function createReportFromSchedule(id) { const s = schedules.find(x=>x.id===id); if(!s)return; document.getElementById('formSiteName').value = s.customer; document.getElementById('formWorkDate').value = s.date; switchView('report'); closeScheduleDetailModal(); }
    function openEditScheduleModal(id) {
        editingScheduleId = id;
        const item = schedules.find(s => s.id === id);
        if(!item) return;
        document.getElementById('modalSchedCustomer').value = item.customer;
        document.getElementById('modalSchedDate').value = item.date;
        document.getElementById('modalSchedEndDate').value = item.endDate || item.date;
        document.getElementById('modalSchedTime').value = item.time || '08:30';
        document.getElementById('modalSchedEndTime').value = item.endTime || '17:00';
        document.getElementById('modalSchedPrice').value = item.estimatePrice || '';
        document.getElementById('addScheduleModal').classList.remove('hidden');
        document.getElementById('addScheduleModal').classList.add('flex');
    }
    function autofillFromSelectedDaySchedule() {
        const dayEvents = schedules.filter(s => isDateInRange(selectedDateStr, s.date, s.endDate));
        if(dayEvents.length > 0) createReportFromSchedule(dayEvents[0].id);
    }
    function autofillEstimatePriceFromSchedule() {
        const d = document.getElementById('formWorkDate').value;
        const s = document.getElementById('formSiteName').value;
        const match = schedules.find(x => isDateInRange(d, x.date, x.endDate) || (s && x.customer.includes(s)));
        if(match && match.estimatePrice) document.getElementById('formEstimatePrice').value = match.estimatePrice;
    }
    function openGoogleMapNav() {
        const item = schedules.find(s => s.id === currentDetailScheduleId);
        if(item && item.location) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`, '_blank');
    }
    function exportDataToFile() {
        const str = JSON.stringify({ schedules, dailyReports });
        const blob = new Blob([str], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup.json'; a.click();
    }
    function triggerImportData() { document.getElementById('importFileInput').click(); }
    function handleDataImport(e) {
        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = JSON.parse(evt.target.result);
            if(data.schedules) schedules = data.schedules;
            if(data.dailyReports) dailyReports = data.dailyReports;
            saveDataToStorage(); renderAll(); showToast('復元完了');
        };
        reader.readAsText(e.target.files[0]);
    }
    let currentUploadedBase64 = null;
    let currentUploadedFullBase64 = null;
    function openAiScanModal() { document.getElementById('aiScanModal').classList.remove('hidden'); document.getElementById('aiScanModal').classList.add('flex'); }
    function closeAiScanModal() { document.getElementById('aiScanModal').classList.add('hidden'); document.getElementById('aiScanModal').classList.remove('flex'); }
    function triggerFileInput() { document.getElementById('estimateFileInput').click(); }
    async function handleFileSelect(event) {
        const file = event.target.files[0]; if(!file) return;
        document.getElementById('dropArea').classList.add('hidden'); document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('aiLoadingOverlay').classList.remove('hidden');
        const compressed = await compressImageFile(file, 1000, 0.75);
        currentUploadedFullBase64 = compressed;
        document.getElementById('previewImage').src = compressed;
        runGeminiExtraction(compressed.split(',')[1], 'image/jpeg');
    }
    function toggleOptionsMenu() { document.getElementById('optionsMenuModal').classList.toggle('hidden'); document.getElementById('optionsMenuModal').classList.toggle('flex'); }
    function saveGasWebhookUrl(val) { gasWebhookUrl = val; localStorage.setItem('GAS_WEBHOOK_URL', val); updateGasSyncBadge(); }
    function updateGasSyncBadge() { document.getElementById('gasSyncBadge').classList.toggle('hidden', !gasWebhookUrl); }
    function switchView(mode) { document.getElementById('view-calendar-container').classList.toggle('hidden', mode!=='calendar'); document.getElementById('view-report-container').classList.toggle('hidden', mode!=='report'); }
    function togglePwaInstallGuide() { document.getElementById('pwaInstallGuideModal').classList.toggle('hidden'); document.getElementById('pwaInstallGuideModal').classList.toggle('flex'); }
    function toggleGasGuideModal() { document.getElementById('gasGuideModal').classList.toggle('hidden'); document.getElementById('gasGuideModal').classList.toggle('flex'); }
    function copyReportAsFormText(id) { /* implement logic */ }
  </script>
